# =====================================================================================
# PRAYAAN: Automated Local Database Environment (PostgreSQL 16 + PostGIS 3.4)
# Tech4Bharat 2026 / GAVS Hackathon — Theme 5: Rural Freight (Problem Statement 5.3)
# =====================================================================================
# Quickstart:
#   1. Start database:
#        docker compose up -d
#   2. Verify schema and run test suite:
#        docker compose exec db psql -U postgres -d prayaan -f /tests/schema_tests.sql
#   3. Stop database:
#        docker compose down -v
# =====================================================================================

version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: prayaan_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: prayaan
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./tests:/tests:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prayaan"]
      interval: 5s
      timeout: 5s
      retries: 5
